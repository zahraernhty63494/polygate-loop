name: polygate-loop
run-name: polygate-${{ inputs.subdomain }}-${{ inputs.runner }}

# A self-dispatching relay that keeps a Polygate panel online on GitHub runners,
# under one stable domain.
#
#   runner a --(overlap)--> runner b --(overlap)--> runner a --...
#
# Timing, per run (defaults):
#   * one hour of service per run              session_seconds = 3900
#   * the next run is dispatched 5 minutes     HANDOFF_LEAD_SECONDS = 300
#     before this one's planned end
#   * this run stops only AFTER the new run's   "Hand the baton" step
#     panel is confirmed up
# So the panel is live continuously, two runners overlap for ~1 minute, and a
# fresh run appears exactly once an hour.
#
# Manual override (quota exhausted, or a fresh runner wanted right now):
#   dispatch a run from the Actions tab whenever you like - it starts
#   immediately instead of queueing. It becomes the newest run, so the older
#   run stops by itself once the new panel is confirmed; cancelling the old run
#   by hand also works and is safe. A run never starts a third chain: if a newer
#   run for the same subdomain is already active, it waits for that one and
#   hands over instead of dispatching its own.
#
# Fixed across runs (and the only fixed things):
#   * the dashboard password        POLYGATE_ADMIN_PASSWORD
#   * the client API key            POLYGATE_CLIENT_KEY
# The key value lives in a tiny encrypted seed (POLYGATE_SEED_B64) that is
# restored on every start. There is no state backup, no snapshot and no export.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Which half starts (only a label; it just decides who is dispatched next)"
        type: choice
        options: [a, b]
        default: a
      subdomain:
        description: "Panel subdomain (first label only, e.g. polygate) - .codol.ir is appended"
        type: string
        required: false
        default: polygate
      session_seconds:
        description: "Planned life of this run in seconds; the next one starts 5 min before the end (3900 = hourly)"
        type: string
        required: false
        default: "3900"

# Deliberately no shared concurrency group: the relay overlaps on purpose and a
# manual run must start at once instead of waiting in a queue. Duplicate chains
# are prevented at the handoff, not by the queue.
permissions:
  contents: read
  actions: write

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    env:
      # Polygate listens on loopback; cloudflared is the only public entrance.
      ROUTER_PORT: "4317"
      BASE_DOMAIN: codol.ir
      SUBDOMAIN_INPUT: ${{ inputs.subdomain }}
      SESSION_INPUT: ${{ inputs.session_seconds }}
      RUNNER_LABEL: ${{ inputs.runner }}
      NEXT_LABEL: ${{ inputs.runner == 'a' && 'b' || 'a' }}
      HANDOFF_LEAD_SECONDS: "300"

      # 12+ characters, fixed for every run.
      POLYGATE_ADMIN_PASSWORD: ${{ secrets.POLYGATE_ADMIN_PASSWORD }}

      # The fixed client key and the seed that carries it.
      POLYGATE_SEED_B64: ${{ secrets.POLYGATE_SEED_B64 }}
      POLYGATE_SEED_PASSPHRASE: ${{ secrets.POLYGATE_SEED_PASSPHRASE }}
      POLYGATE_CLIENT_KEY: ${{ secrets.POLYGATE_CLIENT_KEY }}

      # Tunnel: created per run through the API. CF_TUNNEL_TOKEN is left out on
      # purpose (a token is one fixed tunnel and would couple the runs).
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

      POLYGATE_STATE_DIR: "/var/lib/polygate"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Normalise and validate the subdomain, then export everything that
      # depends on it. The input goes through an env var (never interpolated
      # into the script) so it cannot inject shell code.
      - name: Resolve domain
        run: |
          set -euo pipefail
          SUB="$(printf '%s' "${SUBDOMAIN_INPUT:-polygate}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          SUB="${SUB%.${BASE_DOMAIN}}"
          if ! printf '%s' "$SUB" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'; then
            echo "::error::Invalid subdomain: '${SUBDOMAIN_INPUT}' - use letters, digits and dashes only."
            exit 1
          fi
          {
            echo "ROUTER_DOMAIN=${SUB}.${BASE_DOMAIN}"
            echo "CF_TUNNEL_NAME=polygate-${SUB}"
            echo "SUBDOMAIN=${SUB}"
          } >> "$GITHUB_ENV"
          echo "Domain : ${SUB}.${BASE_DOMAIN}"
          echo "Tunnel : polygate-${SUB}"

      - name: Record session start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Record the runner's public IP
        run: echo "RUNNER_PUBLIC_IP=$(curl -s --max-time 15 https://api.ipify.org)" >> "$GITHUB_ENV"

      - name: Start Polygate and the tunnel
        timeout-minutes: 50
        run: node scripts/runner-polygate/polygate.mjs start

      - name: Report
        run: |
          echo "URL      : ${POLYGATE_URL:-unavailable}"
          echo "API base : ${POLYGATE_API_BASE:-unavailable}"
          echo "runner   : ${RUNNER_PUBLIC_IP:-?}"
          echo "password : from the POLYGATE_ADMIN_PASSWORD secret (not printed)"
          echo "api key  : fixed from POLYGATE_CLIENT_KEY (accepted=${POLYGATE_CLIENT_KEY_OK:-0})"
          echo "probe    : ${POLYGATE_PUBLIC_OK:-0}"
          echo "tunnel   : ${CF_TUNNEL_NAME:-?} -> 127.0.0.1:${ROUTER_PORT}"

      - name: Serve until the handoff
        run: |
          set -euo pipefail
          SESSION="${SESSION_INPUT:-3900}"
          LEAD="${HANDOFF_LEAD_SECONDS:-300}"
          DEADLINE=$(( JOB_START + SESSION - LEAD ))
          SLEEP=$(( DEADLINE - $(date +%s) ))
          if [ "$SLEEP" -lt 0 ]; then SLEEP=0; fi
          echo "Handoff at $(date -u -d "@$DEADLINE" +%H:%M:%S)Z, sleeping ${SLEEP}s (session ${SESSION}s, lead ${LEAD}s)..."
          sleep "$SLEEP"

      # The core of the relay: bring the other half up, wait until its panel is
      # proven ready, and only then let this run stop.
      - name: Hand the baton to the next runner
        id: handoff
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          SESSION="${SESSION_INPUT:-3900}"
          READY_TIMEOUT=480
          # Stop trying well before the job's own 100-minute kill.
          RETRY_UNTIL=$(( JOB_START + 5200 ))
          PREFIX="polygate-$(printf '%s' "${SUBDOMAIN}" | tr 'A-Z' 'a-z')-"

          # Active runs of this workflow for this subdomain only; newest first.
          list_active() {
            gh run list --repo "$REPO" --workflow polygate-loop.yml --limit 40 \
              --json databaseId,createdAt,status,displayTitle \
              --jq '.[] | select(.status == "queued" or .status == "pending" or .status == "in_progress" or .status == "waiting") | "\(.databaseId) \(.createdAt) \(.displayTitle)"'
          }

          # The newest active run for this subdomain that is not this one and
          # was created at or after "$1" (ISO timestamp).
          find_other() {
            list_active | awk -v since="$1" -v me="${GITHUB_RUN_ID}" -v pfx="$PREFIX" \
              '$1 != me && $2 >= since && tolower($3) ~ ("^" pfx) { print $1; exit }'
          }

          # "<run status> <start-step conclusion>" for a run.
          step_state() {
            gh run view "$1" --repo "$REPO" --json status,jobs \
              --jq '"\(.status) \([.jobs[].steps[]? | select(.name == "Start Polygate and the tunnel")][0].conclusion // "none")"'
          }

          # True once the run's panel is installed, seeded and its tunnel is up.
          wait_ready() {
            local id="$1" end state
            end=$(( $(date +%s) + READY_TIMEOUT ))
            while [ "$(date +%s)" -lt "$end" ]; do
              state=$(step_state "$id" 2>/dev/null || true)
              case "$state" in
                *" success") echo "run ${id}: the new panel is up"; return 0 ;;
                *" failure"|*" cancelled"|*" skipped")
                  echo "run ${id}: the start step ended with '${state#* }'"; return 1 ;;
                completed*) echo "run ${id}: finished without a ready panel (${state})"; return 1 ;;
              esac
              sleep 10
            done
            echo "run ${id}: not ready after ${READY_TIMEOUT}s"
            return 1
          }

          handoff_ok=0
          # Any active run created after this one started is "newer" and wins.
          MY_START=$(date -u -d "@$JOB_START" +%Y-%m-%dT%H:%M:%SZ)

          # 1. Someone may already be bringing up a newer run (a manual one, or
          #    another relay): let that one take over instead of starting a third.
          OTHER=$(find_other "$MY_START")
          if [ -n "$OTHER" ]; then
            echo "a newer run (${OTHER}) is already active for ${SUBDOMAIN}; waiting for it"
            if wait_ready "$OTHER"; then handoff_ok=1; fi
          fi

          # 2. Otherwise dispatch the other half and wait until its panel answers.
          attempt=0
          while [ "$handoff_ok" -eq 0 ] && [ "$(date +%s)" -lt "$RETRY_UNTIL" ]; do
            attempt=$(( attempt + 1 ))
            SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            echo "handoff attempt ${attempt}: queueing runner ${NEXT_LABEL}"
            if gh workflow run polygate-loop.yml --repo "$REPO" --ref main \
                 -f runner="$NEXT_LABEL" \
                 -f subdomain="$SUBDOMAIN" \
                 -f session_seconds="$SESSION"; then
              NEW=""
              for _ in 1 2 3; do
                NEW=$(find_other "$SINCE")
                [ -n "$NEW" ] && break
                sleep 8
              done
              if [ -n "$NEW" ] && wait_ready "$NEW"; then handoff_ok=1; fi
            fi
            if [ "$handoff_ok" -eq 0 ]; then
              echo "attempt ${attempt} did not come up; retrying in 60s"
              sleep 60
            fi
          done

          if [ "$handoff_ok" -eq 1 ]; then
            # Let the new connector settle before the old one leaves the tunnel.
            sleep 20
            echo "the new runner is serving - this one can stop"
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No replacement came up; the watchdog will restart the relay."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Handoff result
        if: always() && steps.handoff.outcome != 'skipped'
        env:
          HANDOFF_OK: ${{ steps.handoff.outputs.ok }}
        run: |
          if [ "${HANDOFF_OK:-0}" = "1" ]; then
            echo "the next runner was confirmed up before this one stopped"
          else
            echo "::warning::no replacement was confirmed; the watchdog will restart the relay"
          fi

      - name: Service log (only when something failed)
        if: failure()
        run: sudo journalctl -u polygate -n 80 --no-pager || true

      # Always runs: stops the gateway and the tunnel cleanly.
      - name: Stop Polygate
        if: always()
        run: node scripts/runner-polygate/polygate.mjs stop
