name: polygate-loop

# One half of a self-dispatching relay. A run brings Polygate (the free-model
# gateway) up on a fresh GitHub runner, publishes it as
# https://<subdomain>.codol.ir through a Cloudflare Tunnel, keeps it alive for
# ~5h15m, then dispatches the other half just before the 6-hour job cap.
#
#   runner a  --dispatch-->  runner b  --dispatch-->  runner a  --...
#
# The relay runs strictly one at a time (single concurrency group), so the next
# run is queued while the current one is still serving and starts on a fresh VM
# the moment this run finishes. The domain never changes, so the dashboard URL
# and the API base URL stay the same across runners.
#
# Fixed across runs (and the only fixed things):
#   * the dashboard password        POLYGATE_ADMIN_PASSWORD
#   * the client API key            POLYGATE_CLIENT_KEY
# The key value lives in a tiny encrypted seed (POLYGATE_SEED_B64) that is
# restored on every start. There is no state backup, no snapshot and no export:
# each runner starts from the seed and is thrown away at the end.
#
# Nothing else is persisted. Providers, routes and chains come from the seed and
# any change made in the dashboard lasts for the current session only.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Which half starts (only a label; it just decides who is dispatched next)"
        type: choice
        options: [a, b]
        default: a
      subdomain:
        description: "Panel subdomain (first label only, e.g. polygate) - .codol.ir is appended"
        type: string
        required: false
        default: polygate
      session_seconds:
        description: "Session length in seconds (GitHub caps a job at 21600 = 6h)"
        type: string
        required: false
        default: "18900"

concurrency:
  group: polygate-loop
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      # Polygate listens on loopback; cloudflared is the only public entrance.
      ROUTER_PORT: "4317"
      BASE_DOMAIN: codol.ir
      SUBDOMAIN_INPUT: ${{ inputs.subdomain }}
      SESSION_INPUT: ${{ inputs.session_seconds }}
      RUNNER_LABEL: ${{ inputs.runner }}

      # 12+ characters, fixed for every run.
      POLYGATE_ADMIN_PASSWORD: ${{ secrets.POLYGATE_ADMIN_PASSWORD }}

      # The fixed client key and the seed that carries it.
      POLYGATE_SEED_B64: ${{ secrets.POLYGATE_SEED_B64 }}
      POLYGATE_SEED_PASSPHRASE: ${{ secrets.POLYGATE_SEED_PASSPHRASE }}
      POLYGATE_CLIENT_KEY: ${{ secrets.POLYGATE_CLIENT_KEY }}

      # Tunnel: created per run through the API. CF_TUNNEL_TOKEN is left out on
      # purpose (a token is one fixed tunnel and would couple the runs).
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

      POLYGATE_STATE_DIR: "/var/lib/polygate"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Normalise and validate the subdomain, then export everything that
      # depends on it. The input goes through an env var (never interpolated
      # into the script) so it cannot inject shell code.
      - name: Resolve domain
        run: |
          set -euo pipefail
          SUB="$(printf '%s' "${SUBDOMAIN_INPUT:-polygate}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          SUB="${SUB%.${BASE_DOMAIN}}"
          if ! printf '%s' "$SUB" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'; then
            echo "::error::Invalid subdomain: '${SUBDOMAIN_INPUT}' - use letters, digits and dashes only."
            exit 1
          fi
          {
            echo "ROUTER_DOMAIN=${SUB}.${BASE_DOMAIN}"
            echo "CF_TUNNEL_NAME=polygate-${SUB}"
            echo "SUBDOMAIN=${SUB}"
          } >> "$GITHUB_ENV"
          echo "Domain : ${SUB}.${BASE_DOMAIN}"
          echo "Tunnel : polygate-${SUB}"

      - name: Record session start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Record the runner's public IP
        run: echo "RUNNER_PUBLIC_IP=$(curl -s --max-time 15 https://api.ipify.org)" >> "$GITHUB_ENV"

      - name: Start Polygate and the tunnel
        timeout-minutes: 50
        run: node scripts/runner-polygate/polygate.mjs start

      - name: Report
        run: |
          echo "URL      : ${POLYGATE_URL:-unavailable}"
          echo "API base : ${POLYGATE_API_BASE:-unavailable}"
          echo "runner   : ${RUNNER_PUBLIC_IP:-?}"
          echo "password : from the POLYGATE_ADMIN_PASSWORD secret (not printed)"
          echo "api key  : fixed from POLYGATE_CLIENT_KEY (accepted=${POLYGATE_CLIENT_KEY_OK:-0})"
          echo "probe    : ${POLYGATE_PUBLIC_OK:-0}"
          echo "tunnel   : ${CF_TUNNEL_NAME:-?} -> 127.0.0.1:${ROUTER_PORT}"

      - name: Serve until the handoff
        run: |
          set -euo pipefail
          SESSION="${SESSION_INPUT:-18900}"
          TEARDOWN_BUFFER=300
          DEADLINE=$(( JOB_START + SESSION - TEARDOWN_BUFFER ))
          SLEEP=$(( DEADLINE - $(date +%s) ))
          if [ "$SLEEP" -lt 0 ]; then SLEEP=0; fi
          echo "Handoff at $(date -u -d "@$DEADLINE" +%H:%M:%S)Z, sleeping ${SLEEP}s..."
          sleep "$SLEEP"

      # Queues the other half before this job ends. The concurrency group lets it
      # start only after this run is gone, so there is never a second gateway on
      # the same tunnel. Three tries, 20s apart: a transient API error must not
      # break the chain.
      - name: Hand the baton to the next runner
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_LABEL}" = "a" ]; then NEXT=b; else NEXT=a; fi
          for attempt in 1 2 3; do
            if gh workflow run polygate-loop.yml --repo "$REPO" --ref main \
                 -f runner="$NEXT" \
                 -f subdomain="${SUBDOMAIN}" \
                 -f session_seconds="${SESSION_INPUT:-18900}"; then
              echo "Queued runner ${NEXT} on ${SUBDOMAIN}.codol.ir (attempt ${attempt})."
              exit 0
            fi
            echo "dispatch attempt ${attempt} failed; retrying in 20s" >&2
            sleep 20
          done
          echo "::error::Could not queue the next run. The watchdog will restart the relay if it is enabled."
          exit 1

      - name: Service log (only when something failed)
        if: failure()
        run: sudo journalctl -u polygate -n 80 --no-pager || true

      # Always runs: stops the gateway and the tunnel cleanly.
      - name: Stop Polygate
        if: always()
        run: node scripts/runner-polygate/polygate.mjs stop
