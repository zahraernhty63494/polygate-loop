name: polygate-loop-watchdog

# The relay dispatches itself, but a run can die hard: a 6-hour kill, a failed
# tunnel, a cancelled workflow. This watchdog closes that hole - if no
# polygate-loop run is queued or running, it starts one.
#
# It never touches a healthy relay: any queued/running run makes it a no-op.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: polygate-loop-watchdog
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch the loop when nothing is running
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ACTIVE=$(gh api "repos/${REPO}/actions/workflows/polygate-loop.yml/runs?per_page=30" \
            --jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')
          echo "active polygate-loop runs: ${ACTIVE}"
          if [ "${ACTIVE}" -gt 0 ]; then
            echo "the relay is alive - nothing to do"
            exit 0
          fi
          echo "the relay is down - starting runner a"
          gh workflow run polygate-loop.yml --repo "$REPO" --ref main \
            -f runner=a -f subdomain=polygate
